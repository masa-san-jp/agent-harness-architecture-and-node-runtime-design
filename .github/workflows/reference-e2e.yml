name: Reference E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-harness/reference-cli test
      - run: pnpm conformance -- --suite profile
      - run: pnpm conformance -- --suite storage
      - run: pnpm conformance -- --suite bootstrap-e2e
